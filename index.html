<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145b50">
  <title>体調ログ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header><div class="container"><h1>体調ログ</h1></div></header>
  <main class="container">
    <div class="toolbar">
      <button id="add" type="button" aria-controls="editor" aria-expanded="false">追加</button>
    </div>
    <section id="editor" class="panel" aria-labelledby="form-title" hidden>
      <h2 id="form-title" tabindex="-1">体調を記録</h2>
      <form id="record-form">
        <label for="recorded-at">日時</label>
        <input id="recorded-at" type="datetime-local" required>
        <label for="temperature">体温（℃・任意）</label>
        <input id="temperature" type="number" inputmode="decimal" step="any" placeholder="36.5">
        <label for="memo">メモ</label>
        <textarea id="memo" rows="4" placeholder="今日の体調や気になったこと"></textarea>
        <div class="actions">
          <button id="save" type="submit">保存</button>
          <button id="cancel" type="button" class="secondary">キャンセル</button>
        </div>
      </form>
    </section>
    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>
    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">これまでの記録</h2>
      <p id="empty">まだ記録がありません。</p>
      <ul id="records"></ul>
    </section>
  </main>
</body>
</html>
